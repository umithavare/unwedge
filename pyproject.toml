[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "unwedge"
version = "0.1.0"
description = "A circuit breaker for AI coding agents: catches doom loops in Claude Code, Codex CLI and custom agent loops, with optional judgments from TypeSafe jev or a local Laya model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "umithavare" }]
keywords = ["ai-agents", "claude-code", "codex", "doom-loop", "circuit-breaker", "llm-cost", "hooks", "jev", "laya", "typed-decisions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core has no third-party dependencies: it runs inside hook processes on every tool call.
dependencies = []

[project.optional-dependencies]
laya = ["laya>=0.3.11"]  # in-process Laya (PyTorch) for `unwedge serve` and the laya-local provider
laya-mlx = ["laya-mlx>=0.2; sys_platform == 'darwin' and platform_machine == 'arm64'"]
bench = ["numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.6", "numpy>=1.24"]

[project.scripts]
unwedge = "unwedge.cli:main"

[project.urls]
Homepage = "https://github.com/umithavare/unwedge"
Documentation = "https://github.com/umithavare/unwedge/tree/main/docs"
Issues = "https://github.com/umithavare/unwedge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/unwedge"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "plugins/", "benchmarks/*.py", ".claude-plugin/", ".agents/", "README.md",
           "README.tr.md", "LICENSE", "NOTICE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["unwedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "benchmarks"]
